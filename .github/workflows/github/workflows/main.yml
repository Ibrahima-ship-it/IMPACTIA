name: Recette Acceptance Etape 5

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETAPE_5_PACK_CONTENEURS_SECURITE_JELASTIC_DDI_BIV_V4*.zip'

permissions:
  contents: read

jobs:
  run-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le pack
        shell: bash
        run: |
          set -euo pipefail
          zip_file=$(find . -maxdepth 1 -type f -name 'ETAPE_5_PACK_CONTENEURS_SECURITE_JELASTIC_DDI_BIV_V4*.zip' -print -quit)
          test -n "$zip_file"
          unzip -q "$zip_file"

      - name: Exécuter la recette complète
        working-directory: ETAPE_5_DDI_BIV_V4
        shell: bash
        run: |
          set -euo pipefail
          scripts/runtime_acceptance.sh

      - name: Afficher le diagnostic en cas d’échec
        if: failure()
        working-directory: ETAPE_5_DDI_BIV_V4
        run: |
          echo '===== 200 DERNIERES LIGNES ====='
          echo '===== ETAT DOCKER ====='
          docker compose ps -a || true
          echo '===== JOURNAUX SERVICES ====='
          docker compose logs --no-color --tail=100 || true

      - name: Conserver les preuves non sensibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-etape-5
          path: |
            ETAPE_5_DDI_BIV_V4/TEST_RESULTS.json
          retention-days: 30

      - name: Purger les secrets éphémères
        if: always()
        working-directory: ETAPE_5_DDI_BIV_V4
        run: |
          test ! -f .env || shred -u .env
          test ! -f certs/privkey.pem || shred -u certs/privkey.pem
          test ! -f certs/fullchain.pem || shred -u certs/fullchain.pem
