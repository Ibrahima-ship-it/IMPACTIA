name: Test Acceptation Etape 5
on: [push, workflow_dispatch]

jobs:
runs-on: ubuntu-latest
    runs-level: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier l'installation de Docker
        run: docker compose version

      - name: Executer la recette d'acceptation reelle
        run: |
          cp .env.example .env
          bash scripts/runtime_acceptance.sh
